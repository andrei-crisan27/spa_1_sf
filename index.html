<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Servicii funerare non-stop — lorem ipsum dolor sit amet." />
    <meta name="theme-color" content="#1F2A44" />
    <title>Servicii Funerare</title>
    <script>
      // Apply the saved/preferred theme before first paint to avoid a flash.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('sf-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
